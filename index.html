<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Solitaire</title>
</head>
<body>
    <div id="navbar">
        <div id="logo">Solitaire</div>
        <div><button id="New-Game">New</button></div>
        <!-- <div><button>Undo</button></div> -->
        <div><button id="Hint">Hint</button></div>
        <div id="Time">Time Starting</div>
        <div id="ScoreDiv">Score: 0</div>
    </div>

    <div class="grid-container">
        <div class="slot"></div>
        <div class="slot-supplementary-slot"></div> 
        <div class="no-slot"></div> 
        <div class="upper-slot" style="color: black;">♠</div>
        <div class="upper-slot" style="color: red;">♥</div>
        <div class="upper-slot" style="color: red;">♦</div>
        <div class="upper-slot" style="color: black;">♣</div>

        <div class="slot tableau"></div>
        <div class="slot tableau"></div>
        <div class="slot tableau"></div>
        <div class="slot tableau"></div>
        <div class="slot tableau"></div>
        <div class="slot tableau"></div>
        <div class="slot tableau"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
